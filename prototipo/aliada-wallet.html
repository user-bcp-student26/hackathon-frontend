<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu Billetera ALiaDA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — rail de navegación oscuro a la izquierda (barra inferior en móvil), topbar fija, vistas por historia W1–W6 con regiones que se refrescan solas */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface-2:#F6F8FC; --line:#E0E5EF; --line-2:#CBD3E2;
  --fg:#0C1A33; --muted:#5D6981; --faint:#8C97AC;
  --brand:#0E2A66; --brand-2:#1D4ED8; --brand-soft:#E3EAFB;
  --accent:#FF6A2B; --accent-2:#FF8F5C; --accent-soft:#FFEADF; --on-accent:#FFFFFF;
  --ok:#0F8A53; --ok-soft:#DCF3E7; --warn:#B26B00; --warn-soft:#FFF0CF; --bad:#CC3333; --bad-soft:#FCE2E2; --info:#2459D6; --info-soft:#E1E9FD; --violet:#6B46C1; --violet-soft:#EDE6FB;
  --side:#0A1B40; --side-2:#12285A; --side-fg:#B9C6E4; --side-active:#FFFFFF;
  --shadow:0 1px 2px rgba(12,26,51,.05),0 10px 30px -14px rgba(12,26,51,.22);
  --shadow-lg:0 30px 80px -20px rgba(12,26,51,.45);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070F20; --surface:#0E1A31; --surface-2:#12203B; --line:#1E2D4B; --line-2:#2B3C5F;
  --fg:#E7ECF6; --muted:#98A5BF; --faint:#6C7A96;
  --brand:#8FB0FF; --brand-2:#6E95FF; --brand-soft:#16264A;
  --accent:#FF7A40; --accent-2:#FF9B6B; --accent-soft:#3A1F14; --on-accent:#1A0B04;
  --ok:#3DD08E; --ok-soft:#0F2E22; --warn:#F2B544; --warn-soft:#33260C; --bad:#FF6B6B; --bad-soft:#3A1518; --info:#7AA2FF; --info-soft:#14234A; --violet:#B597FF; --violet-soft:#241A40;
  --side:#050C1C; --side-2:#0F1D3D; --side-fg:#95A3C2; --side-active:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070F20; --surface:#0E1A31; --surface-2:#12203B; --line:#1E2D4B; --line-2:#2B3C5F;
  --fg:#E7ECF6; --muted:#98A5BF; --faint:#6C7A96;
  --brand:#8FB0FF; --brand-2:#6E95FF; --brand-soft:#16264A;
  --accent:#FF7A40; --accent-2:#FF9B6B; --accent-soft:#3A1F14; --on-accent:#1A0B04;
  --ok:#3DD08E; --ok-soft:#0F2E22; --warn:#F2B544; --warn-soft:#33260C; --bad:#FF6B6B; --bad-soft:#3A1518; --info:#7AA2FF; --info-soft:#14234A; --violet:#B597FF; --violet-soft:#241A40;
  --side:#050C1C; --side-2:#0F1D3D; --side-fg:#95A3C2; --side-active:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.8);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;padding:22px 14px;gap:22px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none;color:#fff}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand b i{font-style:normal;color:var(--accent)}
.brand small{display:block;font-size:11px;color:var(--side-fg);letter-spacing:.04em;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6F80A8;padding:12px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--side-fg);font-weight:500;position:relative;transition:background .2s,color .2s}
.nav a:hover{background:var(--side-2);color:#fff}
.nav a.on{background:var(--side-2);color:var(--side-active)}
.nav a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav a .wtag{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.07);color:#8FA0C6}
.nav a.on .wtag{background:var(--accent);color:#fff}
.nav a .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--side-2);font-size:12px;line-height:1.45}
.side-foot b{color:#fff;display:block;margin-bottom:2px}

.main-wrap{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px}
.crumb{display:flex;flex-direction:column;min-width:0}
.crumb small{font-size:11.5px;color:var(--muted)}
.crumb strong{font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:transform .15s,background .2s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:18px;height:18px}
.who{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.who .txt{display:flex;flex-direction:column;line-height:1.15}
.who .txt b{font-size:13px}
.who .txt span{font-size:11px;color:var(--muted)}
main{padding-block:26px 120px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1320px;width:100%}

/* ---------- primitives ---------- */
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;letter-spacing:.02em}
.avatar.lg{width:48px;height:48px;font-size:16px}
.avatar.sq{border-radius:11px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.violet{background:var(--violet-soft);color:var(--violet)}
.pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.live::before{animation:pulse 1.2s infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid transparent;font-weight:600;font-size:14px;text-decoration:none;transition:transform .12s,background .2s,box-shadow .2s,opacity .2s;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px -8px var(--accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.dark{background:var(--brand);color:var(--surface)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line-2)}
.btn.soft{background:var(--brand-soft);color:var(--brand-2)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.okb{background:var(--ok-soft);color:var(--ok)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.panel-h h3{font-size:16.5px}
.panel-h .sub{font-size:12.5px;color:var(--muted)}
.panel-h .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.input{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);transition:border-color .2s,box-shadow .2s;min-width:0}
.input:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 4px var(--brand-soft)}
.input.err{border-color:var(--bad)}
.input.okk{border-color:var(--ok)}
.hint{font-size:12px;color:var(--faint);min-height:18px}
.hint.err{color:var(--bad)}
.hint.okk{color:var(--ok)}
.grid-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-f .full{grid-column:1/-1}
.divider{height:1px;background:var(--line);margin:16px 0}
.tag{display:inline-grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:12px;padding:3px 8px;border-radius:7px;color:#fff}
.tag.w1{background:#2B6CB0}.tag.w2{background:#B7791F}.tag.w3{background:#2F855A}.tag.w4{background:#6B46C1}.tag.w5{background:#C53060}.tag.w6{background:#2C5282}.tag.hitl{background:#4A5568}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--line-2);border-radius:12px}
.kbd{font-family:var(--f-mono);font-size:11.5px;padding:2px 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.scroll-x{overflow-x:auto}

/* ---------- page head ---------- */
.page-head{display:flex;align-items:flex-end;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.page-head .ttl{display:flex;flex-direction:column;gap:8px;min-width:0}
.page-head .row{display:flex;align-items:center;gap:10px}
.page-head h1{font-size:clamp(26px,3.2vw,34px);font-weight:800;line-height:1.05}
.page-head p{color:var(--muted);max-width:62ch}
.page-head .end{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}

/* ---------- reveal & loading ---------- */
.r{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.sk{border-radius:10px;background:linear-gradient(90deg,var(--surface-2) 0%,var(--line) 40%,var(--surface-2) 80%);background-size:200% 100%;animation:shimmer 1.1s linear infinite}
.sk-grid{display:grid;gap:16px}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;display:inline-block;flex:none}
.flash{animation:flash 1.4s ease-out}
.route-bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--brand-2));z-index:80;width:0;opacity:0;transition:width .35s ease,opacity .3s}

/* ---------- dashboard ---------- */
.dash-top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.balance{position:relative;overflow:hidden;border-radius:20px;padding:26px;background:var(--side);color:#fff;isolation:isolate;min-height:250px;display:flex;flex-direction:column}
.balance::before{content:"";position:absolute;inset:-40% -20% auto auto;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--accent) 0%,transparent 62%);opacity:.55;z-index:-1;animation:float 9s ease-in-out infinite}
.balance::after{content:"";position:absolute;inset:auto auto -55% -15%;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,#1D4ED8 0%,transparent 65%);opacity:.7;z-index:-1;animation:float 11s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-24px,18px)}}
.balance .rings{position:absolute;right:22px;top:22px;opacity:.9}
.balance .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#C5D0EC;font-weight:700;display:flex;align-items:center;gap:8px}
.balance .lbl button{border:0;background:rgba(255,255,255,.12);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff}
.balance .lbl button svg{width:16px;height:16px}
.balance .amt{font-family:var(--f-display);font-size:clamp(36px,5vw,52px);font-weight:800;letter-spacing:-.03em;margin:10px 0 4px;line-height:1}
.balance .meta{color:#C5D0EC;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.balance .qa{margin-top:auto;padding-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.qa a{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;text-decoration:none;font-weight:600;font-size:13.5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff;transition:background .2s,transform .15s}
.qa a:hover{background:rgba(255,255,255,.2);transform:translateY(-2px)}
.qa a.main{background:var(--accent);border-color:var(--accent);color:#fff}
.qa svg{width:17px;height:17px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;overflow:hidden}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .k i{width:8px;height:8px;border-radius:3px;display:inline-block}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .d{font-size:12px;color:var(--faint)}
.kpi svg.spark{position:absolute;right:12px;bottom:12px;width:84px;height:30px}
.dash-mid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.dash-bot{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--faint);font-size:11px;font-family:var(--f-body)}
.chart .bin{fill:var(--brand-2)}
.chart .bout{fill:var(--accent)}
.chart rect.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.svc{display:flex;flex-direction:column;gap:4px}
.svc-row{display:grid;grid-template-columns:minmax(0,1fr) auto 74px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.svc-row:last-child{border-bottom:0}
.svc-row b{font-size:13.5px;display:block}
.svc-row small{color:var(--muted);font-size:12px}
.svc-row svg{width:74px;height:26px}
.tx-list{display:flex;flex-direction:column}
.tx{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 8px;border-radius:11px;cursor:pointer;transition:background .15s;border:0;background:transparent;text-align:left;width:100%}
.tx:hover{background:var(--surface-2)}
.tx .who2{min-width:0}
.tx .who2 b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .who2 small{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tx .amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.tx .amt b{font-variant-numeric:tabular-nums;font-size:14.5px}
.tx .amt b.in{color:var(--ok)}
.tx .amt b.void{text-decoration:line-through;color:var(--faint)}
.tx.new{animation:slidein .5s ease both, flash 1.6s ease-out}
.cov{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cov a{display:flex;flex-direction:column;gap:6px;padding:13px;border-radius:12px;border:1px solid var(--line);text-decoration:none;transition:border-color .2s,transform .15s,background .2s;min-width:0}
.cov a:hover{border-color:var(--line-2);transform:translateY(-2px);background:var(--surface-2)}
.cov a b{font-size:13.5px}
.cov a small{font-size:12px;color:var(--muted);line-height:1.35}
.cov .bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.cov .bar i{display:block;height:100%;background:var(--ok);border-radius:4px}

/* ---------- banner ---------- */
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;margin-bottom:18px;font-size:13.5px;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner svg{width:18px;height:18px;flex:none}
.banner .btn{margin-left:auto}

/* ---------- onboarding ---------- */
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:22px}
.stp{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.stp .bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.stp .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.stp.done .bar i,.stp.on .bar i{width:100%}
.stp.on{color:var(--fg)}
.stp.done{color:var(--ok)}
.stp span{display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-body{animation:slidein .4s ease both}
.strength{display:flex;gap:4px;margin-top:4px}
.strength i{flex:1;height:4px;border-radius:3px;background:var(--line);transition:background .3s}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.drop{border:1.5px dashed var(--line-2);border-radius:14px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);transition:border-color .2s,background .2s;cursor:pointer;position:relative}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:26px;height:26px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.doc-prev{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.dni{aspect-ratio:1.58;max-width:100%;border-radius:12px;padding:12px;background:linear-gradient(135deg,#DDE7F7,#F5E8DA);color:#22314F;display:grid;grid-template-columns:30% 1fr;gap:10px;font-size:10.5px;position:relative;overflow:hidden;animation:pop .5s ease both}
.dni .ph{border-radius:8px;background:linear-gradient(160deg,#9BB0D3,#6E83AA);display:grid;place-items:end center;overflow:hidden}
.dni .ph::after{content:"";width:60%;aspect-ratio:1;border-radius:50% 50% 0 0;background:#E9EEF7;opacity:.8}
.dni .ln{display:flex;flex-direction:column;gap:3px}
.dni .ln b{font-size:11.5px}
.dni .mrz{position:absolute;left:12px;right:12px;bottom:8px;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.06em;opacity:.7;white-space:nowrap;overflow:hidden}
.doc-img{width:100%;aspect-ratio:1.58;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.selfie{aspect-ratio:1.58;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;position:relative;overflow:hidden}
.selfie .face{width:70px;height:70px;border-radius:50%;background:linear-gradient(160deg,#F2C6A0,#C98F68);position:relative;animation:pop .5s ease both}
.selfie .oval{position:absolute;width:110px;height:130px;border:2px dashed var(--accent);border-radius:50%;animation:spin 8s linear infinite}
.kyc-list{display:flex;flex-direction:column;gap:10px}
.kyc-item{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);transition:border-color .3s,background .3s}
.kyc-item .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.kyc-item .ic svg{width:17px;height:17px}
.kyc-item b{font-size:13.5px;display:block}
.kyc-item small{font-size:12px;color:var(--muted)}
.kyc-item.run{border-color:var(--brand-2)}
.kyc-item.run .ic{color:var(--brand-2);background:var(--brand-soft)}
.kyc-item.ok .ic{color:var(--ok);background:var(--ok-soft)}
.kyc-item.warn .ic{color:var(--warn);background:var(--warn-soft)}
.kyc-item.bad .ic{color:var(--bad);background:var(--bad-soft)}
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:12px 0 4px}
.result .ring{width:92px;height:92px}
.result .ring circle.bgc{stroke:var(--line)}
.result .ring .pr{stroke-dasharray:264;stroke-dashoffset:264;animation:draw 1s .1s cubic-bezier(.2,.8,.2,1) forwards}
.result .ring .ck{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .8s ease forwards}
.result h2{font-size:24px}
.result p{color:var(--muted);max-width:46ch}
.result .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.code{background:var(--side);color:#D5DEF2;border-radius:12px;padding:14px 16px;font-family:var(--f-mono);font-size:12px;line-height:1.6;overflow-x:auto;white-space:pre;margin:0}
.code .k{color:#8FB4FF}.code .s{color:#FFB98F}.code .n{color:#7EE2B0}.code .c{color:#6F80A8}.code .m{color:#FF8F5C;font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.new td{animation:flash 1.6s ease-out}
table.t td.r{text-align:right}
table.t .mono{white-space:nowrap}

/* ---------- pay ---------- */
.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.ct{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);transition:border-color .2s,transform .15s,background .2s;text-align:center;min-width:0}
.ct:hover{transform:translateY(-2px);border-color:var(--line-2)}
.ct.on{border-color:var(--accent);background:var(--accent-soft)}
.ct b{font-size:12.5px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct small{font-size:11px;color:var(--muted)}
.amount-field{display:flex;align-items:baseline;gap:8px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface-2);transition:border-color .2s,box-shadow .2s}
.amount-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.amount-field span{font-family:var(--f-display);font-size:26px;color:var(--muted);font-weight:700}
.amount-field input{border:0;background:transparent;font-family:var(--f-display);font-size:38px;font-weight:800;width:100%;min-width:0;outline:none;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;transition:background .2s,border-color .2s}
.chip:hover{border-color:var(--line-2);background:var(--surface-2)}
.chip.on{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.summary{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px}
.summary .row{display:flex;justify-content:space-between;gap:10px}
.summary .row span{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.tracker{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface);animation:rise .4s ease both}
.trk-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:14px}
.trk-steps div{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--faint)}
.trk-steps div i{height:5px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.trk-steps div.done{color:var(--fg)}
.trk-steps div.done i{background:var(--ok)}
.trk-steps div.bad i{background:var(--bad)}
.trk-steps div.warn i{background:var(--warn)}
.trk-steps div.now i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--brand-2),transparent);animation:shimmer 1s linear infinite;background-size:200% 100%}
.tl{display:flex;flex-direction:column;gap:0;position:relative}
.tl-i{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;font-size:12.5px;padding:5px 0;animation:slidein .35s ease both}
.tl-i i{width:10px;height:10px;border-radius:50%;margin-top:4px;background:var(--line-2);box-shadow:0 0 0 3px var(--surface);position:relative;z-index:1;justify-self:center}
.tl-i i.ok{background:var(--ok)}.tl-i i.bad{background:var(--bad)}.tl-i i.warn{background:var(--warn)}.tl-i i.info{background:var(--info)}.tl-i i.violet{background:var(--violet)}
.tl-i time{color:var(--faint);font-family:var(--f-mono);font-size:11px}
.hist-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1;min-width:160px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.search input{padding-left:34px}

/* ---------- QR ---------- */
.qr-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.qr-card{border-radius:20px;padding:22px;background:var(--side);color:#fff;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;overflow:hidden}
.qr-card::before{content:"";position:absolute;inset:auto -30% -50% auto;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--accent),transparent 65%);opacity:.45}
.qr-plate{background:#fff;border-radius:16px;padding:12px;position:relative;box-shadow:0 20px 40px -18px rgba(0,0,0,.6)}
.qr-plate canvas{display:block;width:220px;height:220px;max-width:100%}
.qr-plate.anim canvas{animation:pop .5s ease both}
.qr-card .m{font-family:var(--f-display);font-size:20px;font-weight:700;position:relative}
.qr-card .s{font-size:12.5px;color:#C5D0EC;position:relative;text-align:center}
.qr-card .payload{font-family:var(--f-mono);font-size:11px;background:rgba(255,255,255,.08);padding:8px 10px;border-radius:9px;word-break:break-all;color:#D5DEF2;position:relative;max-width:100%}
.read-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.ropt{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;position:relative;transition:border-color .2s,transform .15s;min-width:0}
.ropt:hover{border-color:var(--accent);transform:translateY(-2px)}
.ropt .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.ropt .ic svg{width:19px;height:19px}
.ropt b{font-size:14px}
.ropt small{font-size:12px;color:var(--muted)}
.ropt input{position:absolute;inset:0;opacity:0;cursor:pointer}
.viewfinder{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:16px;overflow:hidden;background:#0A1222;display:grid;place-items:center}
.viewfinder img,.viewfinder canvas{max-width:72%;max-height:80%;border-radius:10px;opacity:.9}
.viewfinder .corners{position:absolute;inset:14%;border-radius:12px;background:
  linear-gradient(var(--accent),var(--accent)) top left/28px 3px no-repeat,linear-gradient(var(--accent),var(--accent)) top left/3px 28px no-repeat,
  linear-gradient(var(--accent),var(--accent)) top right/28px 3px no-repeat,linear-gradient(var(--accent),var(--accent)) top right/3px 28px no-repeat,
  linear-gradient(var(--accent),var(--accent)) bottom left/28px 3px no-repeat,linear-gradient(var(--accent),var(--accent)) bottom left/3px 28px no-repeat,
  linear-gradient(var(--accent),var(--accent)) bottom right/28px 3px no-repeat,linear-gradient(var(--accent),var(--accent)) bottom right/3px 28px no-repeat}
.viewfinder .laser{position:absolute;left:14%;right:14%;height:2px;background:var(--accent);box-shadow:0 0 18px 4px var(--accent);animation:laser 1.6s ease-in-out infinite}
@keyframes laser{0%,100%{top:16%}50%{top:82%}}
.viewfinder .cap{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#C5D0EC;font-size:12px}
.merchants{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.merch{display:flex;gap:10px;align-items:center;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:border-color .2s,background .2s;min-width:0}
.merch:hover{border-color:var(--accent);background:var(--accent-soft)}
.merch b{font-size:13px;display:block}
.merch small{font-size:11.5px;color:var(--muted)}
.sheet{border-radius:16px;border:1.5px solid var(--accent);background:var(--surface);padding:18px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}

/* ---------- idempotency ---------- */
.idem-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start;margin-bottom:18px}
.keybox{display:flex;gap:8px;align-items:center}
.keybox .input{font-family:var(--f-mono);font-size:12.5px}
.resp{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding-right:4px}
.rcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);animation:slidein .4s ease both}
.rcard .code-b{font-family:var(--f-mono);font-weight:700;font-size:13px;padding:4px 8px;border-radius:8px;height:fit-content}
.rcard .code-b.c2{background:var(--ok-soft);color:var(--ok)}
.rcard .code-b.c3{background:var(--info-soft);color:var(--info)}
.rcard .code-b.c4{background:var(--warn-soft);color:var(--warn)}
.rcard .code-b.c5{background:var(--bad-soft);color:var(--bad)}
.rcard b{font-size:13.5px;display:block}
.rcard small{font-size:12px;color:var(--muted);display:block}
.tests{display:flex;flex-direction:column;gap:8px}
.test{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;background:var(--surface)}
.test .st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.test .st svg{width:14px;height:14px}
.test.pass .st{background:var(--ok-soft);color:var(--ok);animation:pop .35s ease both}
.test.fail .st{background:var(--bad-soft);color:var(--bad)}
.test.run{border-color:var(--brand-2)}
.test small{color:var(--faint);font-family:var(--f-mono);font-size:11px}
.hits{display:inline-grid;place-items:center;min-width:26px;height:22px;border-radius:7px;font-weight:700;font-size:12px;background:var(--surface-2);border:1px solid var(--line)}
.hits.hot{background:var(--violet-soft);color:var(--violet);border-color:transparent}

/* ---------- faults ---------- */
.fault-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;align-items:start;margin-bottom:18px}
.slider{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.slider:last-of-type{border-bottom:0}
.slider .hd{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600;gap:8px}
.slider .hd small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.slider .val{font-family:var(--f-mono);font-size:13px;font-weight:600;min-width:44px;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
.fsm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:center;position:relative}
.fsm .col{display:flex;flex-direction:column;gap:10px;position:relative}
.fsm .col:not(:last-child)::after{content:"";position:absolute;right:-12px;top:50%;width:12px;height:2px;background:var(--line-2)}
.node{padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;text-align:center;color:var(--faint);transition:all .3s;font-family:var(--f-mono);letter-spacing:.02em}
.node.v{color:var(--fg);border-color:var(--line-2);background:var(--surface-2)}
.node.cur{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft);animation:pop .4s ease both}
.node.cur.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft);box-shadow:0 0 0 4px var(--ok-soft)}
.node.cur.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft);box-shadow:0 0 0 4px var(--bad-soft)}
.node.cur.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);box-shadow:0 0 0 4px var(--warn-soft)}
.dist{display:flex;flex-direction:column;gap:9px}
.dist-row{display:grid;grid-template-columns:96px minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:12.5px}
.dist-row .tr{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.dist-row .tr i{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.force{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- recon ---------- */
.sources{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.src{border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;min-width:0}
.src .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:6px}
.src .ic svg{width:19px;height:19px}
.src b{font-size:14.5px}
.src .big{font-family:var(--f-display);font-size:24px;font-weight:700}
.src small{color:var(--muted);font-size:12px}
.src.scan::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--brand-2) 18%,transparent),transparent);background-size:200% 100%;animation:shimmer 1s linear infinite}
.prog{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-2),var(--accent));width:0;transition:width .25s linear;border-radius:6px}
.recon-sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.donut{width:132px;height:132px}
.donut circle{fill:none;stroke-width:16}
.donut .seg{transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
.donut text{fill:var(--fg);font-family:var(--f-display);font-weight:700}
.donut text.s{fill:var(--muted);font-family:var(--f-body);font-weight:500;font-size:9px}
.sum-l{display:flex;flex-direction:column;gap:8px;font-size:13px}
.sum-l div{display:flex;align-items:center;gap:8px}
.sum-l i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sum-l b{margin-left:auto;font-variant-numeric:tabular-nums}
.cellv{font-variant-numeric:tabular-nums;white-space:nowrap}
.cellv.miss{color:var(--faint)}
.cellv.diff{color:var(--bad);font-weight:700}

/* ---------- HITL ---------- */
.hitl-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:start}
.tk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%;transition:border-color .2s,background .2s;margin-bottom:8px}
.tk:hover{border-color:var(--line-2)}
.tk.on{border-color:var(--accent);background:var(--accent-soft)}
.tk b{font-size:13.5px;display:block}
.tk small{font-size:12px;color:var(--muted)}
.tk .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.tk .ic svg{width:18px;height:18px}
.sla{font-family:var(--f-mono);font-size:11.5px;color:var(--warn)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}

/* ---------- receipt modal ---------- */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:rgba(5,12,28,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{width:min(420px,100%);max-height:90vh;overflow-y:auto;animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.receipt{background:var(--surface);border-radius:18px 18px 0 0;padding:26px 22px 18px;position:relative;box-shadow:var(--shadow-lg)}
.receipt-foot{height:16px;background:radial-gradient(circle at 10px -2px,transparent 10px,var(--surface) 10.5px) 0 0/20px 16px repeat-x;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
.receipt .x{position:absolute;right:14px;top:14px}
.rc-head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-bottom:16px;border-bottom:1.5px dashed var(--line-2)}
.rc-head .badge{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;animation:pop .5s ease both}

/* ---------- console & toasts ---------- */
.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;border:0;background:var(--side);color:#fff;font-weight:600;font-size:13px;box-shadow:var(--shadow-lg);transition:transform .2s}

.console{position:fixed;right:0;top:0;bottom:0;width:min(460px,100%);z-index:85;background:var(--side);color:#D5DEF2;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}

.console-b{flex:1;overflow-y:auto;padding:10px 12px;font-family:var(--f-mono);font-size:11.5px}
.log{display:grid;grid-template-columns:62px 58px minmax(0,1fr);gap:8px;padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.05);animation:slidein .3s ease both}
.log time{color:#6F80A8}
.log .m{font-weight:700}
.log .m.POST{color:#FF9B6B}.log .m.GET{color:#7EE2B0}.log .m.HOOK{color:#B597FF}.log .m.SKIP,.log .m.c409,.log .m.REPLAY{color:#F2B544}.log .m.c201,.log .m.c200{color:#7EE2B0}.log .m.ERR,.log .m.c4xx{color:#FF6B6B}.log .m.SYS{color:#8FB4FF}
.log .p{color:#fff;overflow-wrap:anywhere}
.log .d{color:#95A3C2;grid-column:3;overflow-wrap:anywhere}
.toasts{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:95;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:12px 14px;border-radius:13px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);animation:slidein .35s cubic-bezier(.2,.8,.2,1) both;font-size:13px}
.toast.out{animation:fade .3s reverse forwards}
.toast .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.toast .ic svg{width:16px;height:16px}
.toast b{display:block;font-size:13.5px}
.toast span{color:var(--muted)}

/* ---------- responsive ---------- */
/* ---------- Mi wallet y contactos ---------- */
.req{color:var(--bad);font-weight:700}
.wid{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px;background:var(--side);color:#fff;position:relative;overflow:hidden;animation:pop .5s ease both}
.wid::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--accent),transparent 65%);opacity:.45}

.wid-row .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.wid small{color:#C5D0EC;position:relative;z-index:1}
.pay-state{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;margin-top:4px}
.pay-state svg{width:22px;height:22px}
.pay-state b{display:block;font-size:14.5px}
.pay-state span{font-size:13px;opacity:.9}
.pay-state.ok{background:var(--ok-soft);color:var(--ok)}
.pay-state.warn{background:var(--warn-soft);color:var(--warn)}
.pay-state.bad{background:var(--bad-soft);color:var(--bad)}
.ct-list{display:flex;flex-direction:column;gap:8px}
.ct-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line)}
.ct-row b{display:block;font-size:13.5px}
.ct-row small{color:var(--muted);font-size:12px}
.ct-row.new{animation:slidein .4s ease both,flash 1.6s ease-out}
.merch[disabled]{pointer-events:none}

/* ---------- gate: bienvenida / onboarding ---------- */
.gate{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--bg)}
.gate.wide{grid-template-columns:320px minmax(0,1fr)}
.gate-art{position:relative;overflow:hidden;isolation:isolate;background:var(--side);color:#fff;display:flex;flex-direction:column;gap:30px;padding-block:36px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px}

.gate-art::after{content:"";position:absolute;left:-160px;bottom:-180px;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,#1D4ED8 0%,transparent 65%);opacity:.75;z-index:-1;animation:float 12s ease-in-out infinite reverse}

.gate.wide .gate-main{align-items:flex-start;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.auth-card{width:min(440px,100%);display:flex;flex-direction:column;gap:16px;animation:rise .6s .15s cubic-bezier(.2,.8,.2,1) both}
.auth-card h2{font-size:30px;font-weight:800;margin-top:4px}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12.5px;white-space:nowrap}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.lg{padding:14px 18px;font-size:15px;border-radius:13px}
.ql-list{display:flex;flex-direction:column;gap:8px}
.ql{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%;transition:border-color .2s,transform .15s}
.ql:hover{border-color:var(--accent);transform:translateX(3px)}
.ql b{font-size:13.5px;display:block}
.ql small{font-size:11.5px;color:var(--muted)}
.auth-msg{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:12px 14px;border-radius:12px;font-size:13.5px;animation:rise .35s ease both}
.auth-msg svg{width:18px;height:18px;margin-top:1px}
.auth-msg.bad{background:var(--bad-soft);color:var(--bad)}
.auth-msg.warn{background:var(--warn-soft);color:var(--warn)}
.auth-msg a{color:inherit;font-weight:700}
.onb-wrap{width:100%;max-width:1100px}
.gate-top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.link-back{display:inline-flex;gap:7px;align-items:center;color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px;padding:6px 0}
.link-back:hover{color:var(--fg)}
.link-back svg{width:16px;height:16px}
@media (max-width:1280px){.gate.wide .two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){

  .floaters,.gate .feat{display:none}
  .gate-main,.gate.wide .gate-main{padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

@media (max-width:1100px){

}

  .side .brand,.side-foot,.nav-label{display:none}

  .nav a .cnt{position:absolute;top:2px;right:4px;margin:0;min-width:16px;height:16px;font-size:10px}
  .nav a.on::before{left:12px;right:12px;top:auto;bottom:-8px;width:auto;height:3px;border-radius:3px 3px 0 0}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:150px}
  .fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .who .txt{display:none}
  .who{padding:4px}
}
@media (max-width:640px){
  .grid-f,.doc-prev,.read-opts,.sources,.cov{grid-template-columns:minmax(0,1fr)}

  .sum-l{width:100%}
  .fab .lbl{display:none}
  .panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

const sleep=(st,ms)=>new Promise(r=>setTimeout(r,ms*st.speed));
function log(st,m,p,d='',lvl=''){st.logs.unshift({t:now(),m,p,d,lvl});if(st.logs.length>250)st.logs.pop();if(st.isMain)bumpFab()}
function step(st,tx,s,m){tx.status=s;tx.timeline.push({s,t:now(),m});const r=st.idem.get(tx.idemKey);if(r&&r.state!=='EN_CURSO')r.state=s;notify(st)}
function note(st,tx,m){tx.timeline.push({s:tx.status,t:now(),m});notify(st)}
function provSet(st,tx,status,amount=tx.amount){const p=st.provider.find(x=>x.ref===tx.provRef);if(p){p.status=status;p.amount=amount;p.t=now()}else st.provider.push({ref:tx.provRef,amount,status,t:now(),source:tx.type==='qr'?'Acquiring':'Payments',owner:tx.owner||st.cur})}
function ledgerAdd(st,tx){st.ledger.push({id:'LG-'+rand(5),ref:tx.provRef,amount:tx.amount,kind:tx.dir==='in'?'CREDITO':'DEBITO',t:now(),owner:tx.owner||st.cur})}
function confirmTx(st,tx,m){
  if(tx.status==='CONFIRMADA')return;
  st.balance=round2(st.balance+(tx.dir==='in'?tx.amount:-tx.amount));
  ledgerAdd(st,tx);
  step(st,tx,'CONFIRMADA',m);
  log(st,'SYS','ledger.post',`${tx.dir==='in'?'Crédito':'Débito'} ${fmt(tx.amount)} · ${tx.ref}`);
  if(st.isMain)toast('ok','Pago confirmado',`${tx.ref} · ${fmt(tx.amount)} ${tx.dir==='in'?'de':'a'} ${tx.cp.name}`);
}
function newTx(st,{dir='out',type='p2p',cp,amount,note,idemKey}){
  st.seq++;
  const t=now();
  return{owner:st.cur,id:'TX-'+rand(6),ref:'OP-'+st.seq,provRef:'PRV-'+(70000+Math.floor(Math.random()*29999)),dir,type,cp,amount:round2(amount),note:note||'',status:'CREADA',createdAt:t,idemKey,reason:'',timeline:[{s:'CREADA',t,m:'Intención de pago creada'}]};
}
function pickOutcome(st){
  if(st.force){const f=st.force;st.force=null;return f}
  const f=st.faults,r=Math.random();let a=0;
  for(const[k,p]of[['timeout',f.timeout],['reject',f.reject],['pending',f.pending]]){a+=p;if(r<a)return k}
  return'ok';
}
function deliverCallback(st,tx,pstatus){
  const k=tx.provRef+':'+pstatus;
  log(st,'HOOK','/webhooks/payments',`Callback ${tx.provRef} → ${pstatus}`);
  if(st.cbSeen.has(k)){
    st.dupIgnored++;
    log(st,'SKIP','/webhooks/payments',`Duplicado ignorado: el evento ${k} ya fue procesado`,'warn');
    note(st,tx,'Callback duplicado recibido e ignorado');
    if(st.isMain)toast('violet','Callback duplicado ignorado',`${tx.ref}: el saldo no se volvió a mover.`);
    return false;
  }
  st.cbSeen.add(k);
  if(pstatus==='APROBADA')confirmTx(st,tx,'Callback del proveedor: aprobada');
  return true;
}
async function pay(st,req){
  const key=req.idemKey||uuid();
  log(st,'POST','/v1/payments/intents',`Idempotency-Key ${short(key)} · ${fmt(req.amount||0)} → ${req.cp.name}`);
  const prev=st.idem.get(key);
  if(prev){
    prev.hits++;prev.last=now();
    const tx=st.txs.find(t=>t.id===prev.txId);
    const http=prev.state==='EN_CURSO'?409:200;
    log(st,'c'+http,'/v1/payments/intents',http===409?`Key ${short(key)} sigue en curso: se rechaza la petición concurrente`:`Replay: se devuelve ${tx.ref} guardada en el store, sin crear operación`,'warn');
    notify(st);
    return{replayed:true,http,tx};
  }
  const acc=curAcc(st);
  if(!canPay(acc)){log(st,'c4xx','/v1/payments/intents','403 · wallet no habilitada para pagos');throw new Error(payBlockReason(acc))}
  if(req.amount>LOW_LIMIT){log(st,'c4xx','/v1/payments/intents','422 · supera el tope de bajo monto');throw new Error(`Los pagos de bajo monto tienen un tope de ${fmt(LOW_LIMIT)} por operación.`)}
  if(!(req.amount>0)){log(st,'c4xx','/v1/payments/intents','422 · monto inválido');throw new Error('Ingresa un monto mayor a S/ 0.00.')}
  if(req.amount>st.balance){log(st,'c4xx','/v1/payments/intents','422 · saldo insuficiente');throw new Error(`Saldo insuficiente: tu saldo es ${fmt(st.balance)}.`)}
  const tx=newTx(st,{...req,idemKey:key});
  st.txs.unshift(tx);req.onCreate?.(tx);
  st.idem.set(key,{key,txId:tx.id,state:'EN_CURSO',hits:1,created:now(),last:now(),amount:tx.amount,http:202});
  log(st,'c201','/v1/payments/intents',`${tx.ref} creada · estado CREADA`);
  notify(st);
  await sleep(st,650);
  step(st,tx,'PROCESANDO',req.type==='qr'?'Autorizando con el adquirente (Acquiring mock)':'Enviado al proveedor de pagos (mock)');
  log(st,'POST',req.type==='qr'?'acquirer/authorize':'provider/charge',`${tx.provRef} · ${fmt(tx.amount)}`);
  const out=pickOutcome(st);
  await sleep(st,out==='timeout'?1700:950);
  await resolveOutcome(st,tx,out);
  const rec=st.idem.get(key);rec.state=tx.status;rec.http=201;
  notify(st);
  return{replayed:false,http:201,tx,outcome:out};
}
async function resolveOutcome(st,tx,out){
  const dup=st.forceDup||Math.random()<st.faults.dup;st.forceDup=false;
  if(out==='ok'){
    if(tx.type==='qr'){note(st,tx,'Comercio validado y autorizado por el adquirente');}
    provSet(st,tx,'APROBADA');
    deliverCallback(st,tx,'APROBADA');
    if(dup){await sleep(st,350);deliverCallback(st,tx,'APROBADA')}
  }else if(out==='reject'){
    tx.reason=pick(REJECT_REASONS);
    provSet(st,tx,'RECHAZADA');
    step(st,tx,'RECHAZADA',`Rechazo del proveedor: ${tx.reason}`);
    log(st,'c4xx','provider/charge',`402 · ${tx.reason}`,'bad');
    if(st.isMain)toast('bad','Pago rechazado',`${tx.ref}: ${tx.reason}. No se descontó saldo.`);
  }else if(out==='pending'){
    provSet(st,tx,'PENDIENTE');
    step(st,tx,'PENDIENTE','Proveedor respondió 202: confirmará por callback');
    log(st,'c200','provider/charge','202 Accepted · confirmación asíncrona');
    if(st.isMain)toast('warn','Pago pendiente',`${tx.ref} se confirmará cuando llegue el callback del proveedor.`);
    setTimeout(()=>{
      if(tx.status!=='PENDIENTE')return;
      provSet(st,tx,'APROBADA');
      deliverCallback(st,tx,'APROBADA');
      const r=st.idem.get(tx.idemKey);if(r)r.state=tx.status;
      if(dup)setTimeout(()=>deliverCallback(st,tx,'APROBADA'),600*st.speed);
    },4500*st.speed);
  }else if(out==='timeout'){
    step(st,tx,'TIMEOUT','Sin respuesta del proveedor en 8 s');
    log(st,'ERR','provider/charge','Timeout de 8000 ms','bad');
    await sleep(st,800);
    log(st,'GET',`/v1/provider/payments/${tx.provRef}`,'Consulta de estado tras timeout');
    const charged=st.forceCharged??(Math.random()<0.6);st.forceCharged=null;
    if(charged){
      provSet(st,tx,'APROBADA');
      note(st,tx,'Consulta de estado: el proveedor sí registró el cargo');
      await sleep(st,800);
      const ok=!st.forceRevFail&&Math.random()>0.2;st.forceRevFail=false;
      const rv={id:'RV-'+rand(5),txId:tx.id,ref:tx.ref,amount:tx.amount,reason:'Timeout con cargo en proveedor',status:ok?'COMPLETADO':'FALLIDO',t:now()};
      st.reversals.unshift(rv);
      log(st,'POST','/v1/reversals',`${rv.id} · ${tx.provRef} · ${fmt(tx.amount)} → ${rv.status}`,ok?'':'bad');
      if(ok){provSet(st,tx,'REVERSADA');tx.reason='Timeout con cargo en proveedor';step(st,tx,'REVERSADA','Reverso automático completado');if(st.isMain)toast('info','Reverso completado',`${tx.ref}: el proveedor devolvió ${fmt(tx.amount)}.`)}
      else{tx.reason='Reverso automático fallido';step(st,tx,'FALLIDA','El reverso automático falló: se escala a soporte');
        createTicket(st,{type:'REVERSO',title:`Reverso fallido · ${tx.ref}`,detail:`Timeout con cargo confirmado en el proveedor (${tx.provRef}) y el reverso ${rv.id} falló. Ejecutar reverso manual o confirmar el pago.`,priority:'Alta',ref:tx.ref});}
    }else{tx.reason='Proveedor no registró el cargo';step(st,tx,'FALLIDA','El proveedor no registró el cargo: no hace falta reverso');if(st.isMain)toast('bad','Pago fallido',`${tx.ref}: timeout sin cargo. No se descontó saldo.`)}
  }
}
async function receive(st,{amount,from,concept}){
  const tx=newTx(st,{dir:'in',type:'qr',cp:{name:from,sub:concept||'Cobro con QR',kind:'persona'},amount,idemKey:uuid()});
  st.txs.unshift(tx);st.idem.set(tx.idemKey,{key:tx.idemKey,txId:tx.id,state:'EN_CURSO',hits:1,created:now(),last:now(),amount,http:202});
  log(st,'HOOK','/webhooks/acquirer',`Abono entrante ${fmt(amount)} · ${from}`);notify(st);
  await sleep(st,700);step(st,tx,'PROCESANDO','Adquirente notificó el pago del QR');

/* =========================================================
   Conciliación (W6)
   ========================================================= */
const W2P={CONFIRMADA:'APROBADA',RECHAZADA:'RECHAZADA',PENDIENTE:'PENDIENTE',REVERSADA:'REVERSADA'};
const myProvider=(st=S)=>st.provider.filter(p=>!p.owner||p.owner===st.cur);
const myLedger=(st=S)=>st.ledger.filter(l=>!l.owner||l.owner===st.cur);
function reconcile(st){
  const prov=myProvider(st),ledg=myLedger(st);
  const refs=new Set([...st.txs.filter(t=>t.status!=='CREADA'&&t.status!=='PROCESANDO').map(t=>t.provRef),...prov.map(p=>p.ref),...ledg.map(l=>l.ref)]);
  const rows=[];
  for(const ref of refs){
    const w=st.txs.find(t=>t.provRef===ref),p=prov.find(x=>x.ref===ref),l=ledg.filter(x=>x.ref===ref);
    const lAmt=l.length?round2(l.reduce((a,x)=>a+x.amount,0)):null;
    let res='ok',label='Conciliado',action=null;
    if(!w&&!p){res='bad';label='Asiento sin operación';action='hitl'}
    else if(!w&&p){res='bad';label='Falta en Wallet';action='hitl'}
    else if(w&&!p){if(w.status==='FALLIDA'){res='ok';label='Conciliado'}else{res='bad';label='Falta en proveedor';action='hitl'}}
    else if(w.status==='PENDIENTE'||w.status==='TIMEOUT'){res='warn';label='En tránsito'}
    else if(W2P[w.status]!==p.status){res='bad';label='Estado distinto';action='hitl'}
    else if(w.status==='CONFIRMADA'&&p.amount!==w.amount){res='bad';label='Diferencia de monto';action='adjust'}
    else if(w.status==='CONFIRMADA'&&lAmt===null){res='bad';label='Falta en ledger';action='ledger'}
    else if(w.status!=='CONFIRMADA'&&lAmt!==null){res='bad';label='Asiento sin operación';action='hitl'}
    rows.push({ref,w,p,l:lAmt,res,label,action,op:w?w.ref:'—'});
  }
  const ord={bad:0,warn:1,ok:2};
  rows.sort((a,b)=>ord[a.res]-ord[b.res]||((b.w?.createdAt||b.p?.t||0)-(a.w?.createdAt||a.p?.t||0)));
  return rows;
}

const countPrev={};
function runCounts(){
  $$('[data-count]:not([data-done])').forEach(el=>{
    el.dataset.done='1';
    const key=el.dataset.ckey,to=parseFloat(el.dataset.count),kind=el.dataset.fmt||'money';
    const from=countPrev[key]??0;countPrev[key]=to;
    const f=v=>kind==='money'?fmt(v):kind==='pct'?Math.round(v)+'%':Math.round(v).toString();
    if(reduceMotion||from===to){el.textContent=f(to);return}
    const t0=performance.now(),dur=900;
    const tick=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=f(from+(to-from)*e);if(k<1)requestAnimationFrame(tick)};
    requestAnimationFrame(tick);
  });
}
function updateRegions(root=document){
  $$('[data-region]',root).forEach(el=>{
    const f=R[el.dataset.region];if(!f)return;
    const html=f(el);

  });
  runCounts();
}

function spark(vals,color,w=84,h=30){
  const mx=Math.max(...vals),mn=Math.min(...vals),rg=mx-mn||1;
  const pts=vals.map((v,i)=>[i*(w-4)/(vals.length-1)+2,h-3-(v-mn)/rg*(h-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return`<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${last[0]} ${h} L2 ${h}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`;
}

  fsm:()=>{const tx=ui.w5.lastTx&&findTx(ui.w5.lastTx);const vis=new Set(tx?tx.timeline.map(e=>e.s):[]);const cur=tx?.status;

  hitlFilters:()=>[['ABIERTO','Abiertos'],['RESUELTO','Resueltos'],['todos','Todos']].map(([k,l])=>`<button class="${ui.hitl.filter===k?'on':''}" data-act="hitlFilter" data-k="${k}">${l} <span class="mono">${k==='todos'?S.tickets.length:S.tickets.filter(t=>t.status===k).length}</span></button>`).join(''),

async function doLogin(){
  const u=ui.login.user.trim().toLowerCase(),p=ui.login.pass,box=$('#loginMsg'),btn=$('#loginBtn');if(!box)return;
  const msg=(cls,icon,html)=>{box.innerHTML=`<div class="auth-msg ${cls}">${ic(icon)}<div>${html}</div></div>`};
  box.innerHTML='';
  if(!u||!p){msg('bad','alert','Ingresa tu correo electrónico y tu contraseña.');return}
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Validando…';
  log(S,'POST','/v1/auth/login',`Correo ${u}`);
  await new Promise(r=>setTimeout(r,700));
  btn.disabled=false;btn.innerHTML='Ingresar '+ic('arrow');
  const a=S.accounts.find(x=>x.email.toLowerCase()===u&&x.pass===p);
  /* Error genérico: no se indica si falló el correo o la contraseña */
  if(!a){log(S,'c4xx','/v1/auth/login','401 · INVALID_CREDENTIALS');msg('bad','alert','Correo o contraseña incorrectos. Revisa tus datos e inténtalo de nuevo.');return}
  log(S,'c200','/v1/auth/login',`Token emitido · ${a.id}`);
  enterAs(a.id,a.wallet&&canPay(a)?'inicio':'activacion');
}
function enterAs(id,route='inicio'){
  switchUser(id);ui.authed=true;const a=curAcc();
  if(!myContacts().some(c=>c.id===ui.w2.cp))ui.w2.cp=myContacts()[0]?.id||null;
  toast('ok',`Hola, ${a.name.split(' ')[0]}`,canPay(a)?'Ingresaste a tu billetera.':payBlockReason(a));
  go(route);location.hash=route;
}

  a.kyc={status:sc,score,reason,at:now()};
  if(sc==='PENDIENTE')a.kyc.ticket=createTicket(S,{type:'KYC',title:`Revisión KYC · ${a.name}`,detail:'Coincidencia biométrica de 71%, bajo el umbral automático de 85%. Validar la selfie contra la foto de RENIEC.',priority:'Media',ref:a.id}).id;
  log(S,'c200','/v1/kyc/verifications',`Resultado ${sc} · score ${score} · pagos ${canPay(a)?'habilitados':'sin habilitar'}`);

/* ---------- QR ---------- */
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function drawQR(cv,text){
  const n=29,ctx=cv.getContext('2d'),S2=cv.width,q=2,cell=S2/(n+q*2);
  let seed=hashStr(text);const rnd=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296};
  ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,S2,S2);ctx.fillStyle='#0C1A33';
  const inF=(x,y)=>(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
  const center=(x,y)=>Math.abs(x-14)<=3&&Math.abs(y-14)<=3;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(inF(x,y)||center(x,y))continue;if(rnd()<.48){const px=(x+q)*cell,py=(y+q)*cell;ctx.beginPath();ctx.roundRect?ctx.roundRect(px+.5,py+.5,cell-1,cell-1,cell*.28):ctx.rect(px,py,cell,cell);ctx.fill()}}
  const finder=(fx,fy)=>{const px=(fx+q)*cell,py=(fy+q)*cell;ctx.fillStyle='#0C1A33';rr(px,py,7*cell,cell*1.6);ctx.fillStyle='#FFFFFF';rr(px+cell,py+cell,5*cell,cell*1.1);ctx.fillStyle='#0C1A33';rr(px+2*cell,py+2*cell,3*cell,cell*.8)};
  const rr=(x,y,w,r)=>{ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,w,r):ctx.rect(x,y,w,w);ctx.fill()};
  finder(0,0);finder(n-7,0);finder(0,n-7);
  const c=(14+q)*cell+cell/2;ctx.fillStyle='#FFFFFF';rr(c-3.6*cell,c-3.6*cell,7.2*cell,cell*1.6);
  ctx.lineWidth=cell*.7;ctx.strokeStyle='#0E2A66';ctx.beginPath();ctx.arc(c-cell*1.1,c,cell*1.9,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#FF6A2B';ctx.beginPath();ctx.arc(c+cell*1.1,c,cell*1.9,0,Math.PI*2);ctx.stroke();
}

function testState(){const st=makeState(false);st.speed=0;st.accounts=[{id:'T',name:'Test',wallet:{id:'WLT-T',status:'ACTIVA'},kyc:{status:'APROBADO'}}];st.cur='T';st.balance=500;return st}
const CP={name:'Camila Rojas',sub:'987',kind:'persona'};
const TESTS=[
  ['Misma idempotency key crea una sola operación',async()=>{const st=testState(),k=uuid();await pay(st,{cp:CP,amount:10,idemKey:k});await pay(st,{cp:CP,amount:10,idemKey:k});if(st.txs.length!==1)throw new Error(`Se crearon ${st.txs.length} operaciones`)}],
  ['El reintento devuelve la misma operación con 200',async()=>{const st=testState(),k=uuid();const a=await pay(st,{cp:CP,amount:10,idemKey:k});const b=await pay(st,{cp:CP,amount:10,idemKey:k});if(!b.replayed||b.tx.id!==a.tx.id||b.http!==200)throw new Error('La respuesta no coincide')}],
  ['Petición concurrente con key en curso responde 409',async()=>{const st=testState(),k=uuid();const p=pay(st,{cp:CP,amount:10,idemKey:k});const b=await pay(st,{cp:CP,amount:10,idemKey:k});await p;if(b.http!==409)throw new Error('Esperaba 409, llegó '+b.http)}],
  ['Callback duplicado no descuenta dos veces',async()=>{const st=testState();st.force='ok';st.forceDup=true;await pay(st,{cp:CP,amount:40,idemKey:uuid()});if(st.balance!==460)throw new Error('Saldo final '+st.balance);if(st.dupIgnored!==1)throw new Error('No se ignoró el duplicado')}],
  ['Keys distintas crean operaciones distintas',async()=>{const st=testState();await pay(st,{cp:CP,amount:5,idemKey:uuid()});await pay(st,{cp:CP,amount:5,idemKey:uuid()});if(st.txs.length!==2)throw new Error('Se esperaban 2 operaciones')}],
  ['Un pago rechazado no mueve el saldo',async()=>{const st=testState();st.force='reject';await pay(st,{cp:CP,amount:50,idemKey:uuid()});if(st.balance!==500)throw new Error('Saldo final '+st.balance)}],
  ['Timeout con cargo en proveedor dispara reverso',async()=>{const st=testState();st.force='timeout';st.forceCharged=true;st.forceRevFail=false;const origRnd=Math.random;Math.random=()=>.9;try{const r=await pay(st,{cp:CP,amount:20,idemKey:uuid()});if(r.tx.status!=='REVERSADA')throw new Error('Estado final '+r.tx.status);if(st.reversals.length!==1)throw new Error('No se registró el reverso')}finally{Math.random=origRnd}}]
];
async function runTests(){
  ui.w4.tests=TESTS.map(([name])=>({name,st:'idle'}));notify();
  log(S,'SYS','tests.run','Suite de idempotencia · 7 casos');
  let pass=0;
  for(let i=0;i<TESTS.length;i++){
    const t=ui.w4.tests[i];t.st='run';notify();
    const t0=performance.now();
    await new Promise(r=>setTimeout(r,280));
    try{await TESTS[i][1]();t.st='pass';pass++}catch(e){t.st='fail';t.err=e.message}
    t.ms=Math.max(1,Math.round(performance.now()-t0-280));notify();
  }
  toast(pass===TESTS.length?'ok':'bad','Tests terminados',`${pass} de ${TESTS.length} en verde.`);
}

    try{const p=pay(S,{cp,amount:round2(3+Math.random()*7),type:'p2p',note:'Prueba de fallas',onCreate:tx=>{ui.w5.lastTx=tx.id}});await p}catch(e){payErr(e)}},
  async w5burst(){if(ui.w5.busy)return;ui.w5.busy=true;ui.w5.burst={ids:[],done:0};const cp={name:'Comercio Sandbox',sub:'Pruebas de fallas',kind:'comercio'};const sp=S.speed;S.speed=.3;notify();
    try{for(let i=0;i<10;i++){const p=pay(S,{cp,amount:round2(1+Math.random()*4),type:'p2p',note:'Ráfaga',onCreate:tx=>{ui.w5.burst.ids.push(tx.id);ui.w5.lastTx=tx.id}});await p;ui.w5.burst.done++;notify()}}catch(e){payErr(e)}finally{S.speed=sp;ui.w5.busy=false;notify()}},
  async retryRev(el){const rv=S.reversals.find(r=>r.id===el.dataset.id);const tx=findTx(rv.txId);el.disabled=true;el.innerHTML='<span class="spinner"></span>';log(S,'POST','/v1/reversals',`Reintento ${rv.id}`);await new Promise(r=>setTimeout(r,1100));
    rv.status='COMPLETADO';if(tx){provSet(S,tx,'REVERSADA');tx.reason='Reverso completado en reintento';step(S,tx,'REVERSADA','Reverso completado en el reintento')}
    const tk=S.tickets.find(t=>t.ref===rv.ref&&t.status==='ABIERTO');if(tk){tk.status='RESUELTO';tk.resolution='Reverso completado en reintento automático'}
    toast('info','Reverso completado',`${rv.ref} quedó reversada.`);notify()},
  /* W6 */
  async reconRun(){if(ui.w6.running)return;ui.w6.running=true;ui.w6.progress=0;ui.w6.rows=null;ui.w6.resolved={};const btn=$('#reconBtn');if(btn)btn.disabled=true;notify();
    log(S,'SYS','recon.start',`Wallet ${S.txs.length} · Proveedor ${myProvider().length} · Ledger ${myLedger().length}`);
    for(let p=0;p<=100;p+=4){ui.w6.progress=p;notify();await new Promise(r=>setTimeout(r,45))}
    ui.w6.rows=reconcile(S);ui.w6.running=false;S.lastRecon=now();if(btn)btn.disabled=false;
    const bad=ui.w6.rows.filter(r=>r.res==='bad').length;log(S,'SYS','recon.done',`${ui.w6.rows.length} referencias · ${bad} diferencias`);
    toast(bad?'warn':'ok','Conciliación terminada',bad?`Encontramos ${bad} diferencias para revisar.`:'Las tres fuentes coinciden.');notify()},
  reconFix(el){const row=ui.w6.rows.find(r=>r.ref===el.dataset.ref);if(!row)return;
    if(row.action==='ledger'){S.ledger.push({id:'LG-'+rand(5),ref:row.ref,amount:row.w.amount,kind:row.w.dir==='in'?'CREDITO':'DEBITO',t:now(),owner:S.cur});ui.w6.resolved[row.ref]='fixed';log(S,'SYS','ledger.post',`Asiento faltante creado · ${row.ref}`);toast('ok','Ledger ajustado',`Se registró el asiento de ${row.op}.`)}
    else if(row.action==='adjust'){const l=S.ledger.find(x=>x.ref===row.ref);const diff=round2(row.p.amount-row.w.amount);if(l)l.amount=row.p.amount;else S.ledger.push({id:'LG-'+rand(5),ref:row.ref,amount:row.p.amount,kind:'DEBITO',t:now(),owner:S.cur});row.w.amount=row.p.amount;S.balance=round2(S.balance-diff);row.w.timeline.push({s:row.w.status,t:now(),m:`Ajuste de conciliación: ${fmt(diff)} según proveedor`});ui.w6.resolved[row.ref]='fixed';log(S,'SYS','ledger.adjust',`${row.ref} · diferencia ${fmt(diff)}`);toast('ok','Diferencia ajustada',`${row.op}: se aplicó ${fmt(diff)} según el proveedor.`)}
    else{const ex=S.tickets.find(t=>t.ref===(row.w?row.w.ref:row.ref)&&t.status==='ABIERTO');if(!ex)createTicket(S,{type:'CONCILIACION',title:`${row.label} · ${row.w?row.w.ref:row.ref}`,detail:`Wallet: ${row.w?fmt(row.w.amount)+' '+ST[row.w.status][1].toLowerCase():'no existe'}. Proveedor: ${row.p?fmt(row.p.amount)+' '+row.p.status.toLowerCase():'no existe'}. Ledger: ${row.l!=null?fmt(row.l):'sin asiento'}.`,priority:'Alta',ref:row.w?row.w.ref:row.ref});ui.w6.resolved[row.ref]='hitl'}
    notify()},
  /* HITL */
  hitlFilter(el){ui.hitl.filter=el.dataset.k;notify()},
  hitlSel(el){ui.hitl.sel=el.dataset.id;notify()},
  hitlDo(el){const t=S.tickets.find(x=>x.id===ui.hitl.sel);if(!t)return;const d=el.dataset.do;
    if(t.type==='KYC'){const a=S.accounts.find(x=>x.id===t.ref);if(a){a.kyc.status=d==='approve'?'APROBADO':'RECHAZADO';a.kyc.score=d==='approve'?86:a.kyc.score;a.kyc.reason=d==='approve'?'Aprobado por analista':'Rechazado por analista';a.kyc.at=now();delete a.kyc.ticket}t.resolution=d==='approve'?'Identidad validada manualmente: pagos habilitados':'Identidad no validada: pagos sin habilitar';log(S,'SYS','hitl.resolve',`${t.id} · ${a?.id} KYC ${a?.kyc.status}`);toast(d==='approve'?'ok':'bad',d==='approve'?'KYC aprobado':'KYC rechazado',d==='approve'?`La wallet de ${a?.name} quedó habilitada para pagos.`:`La wallet de ${a?.name} sigue sin habilitar para pagos.`)}
    else if(d==='manualRev'){const tx=S.txs.find(x=>x.ref===t.ref);if(tx){const rv={id:'RV-'+rand(5),txId:tx.id,ref:tx.ref,amount:tx.amount,reason:'Reverso manual por soporte',status:'MANUAL',t:now()};S.reversals.unshift(rv);S.reversals.filter(r=>r.ref===tx.ref&&r.status==='FALLIDO').forEach(r=>r.status='MANUAL');provSet(S,tx,'REVERSADA');tx.reason='Reverso manual por soporte';step(S,tx,'REVERSADA','Reverso manual ejecutado por soporte');log(S,'POST','/v1/reversals',`${rv.id} manual · ${tx.ref}`)}t.resolution='Reverso manual ejecutado';toast('info','Reverso manual',`${t.ref} quedó reversada.`)}
    else{t.resolution='Cerrado por analista sin acción adicional';toast('ok','Caso cerrado',t.id)}
    t.status='RESUELTO';notify()}
};

document.addEventListener('click',e=>{
  const qa=e.target.closest('a[data-qr]');if(qa){ui.w3.tab=qa.dataset.qr}
  const pc=e.target.closest('a[data-paycp]');if(pc){ui.w2.cp=pc.dataset.paycp}
  const sl=e.target.closest('a[data-sel]');if(sl){ui.hitl.sel=sl.dataset.sel;ui.hitl.filter='ABIERTO'}
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.fault){const k=t.dataset.fault;S.faults[k]=t.value/100;$('#fv-'+k).textContent=t.value+'%';notify();return}
  const p=t.dataset.in;if(!p)return;
  const v=t.type==='checkbox'?t.checked:t.value;
  const parts=p.split('.');let o=ui;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts.at(-1)]=v;
  if(p.startsWith('onb.d.')){
    const k=parts.at(-1),err=VALID[k](v),h=$('#h-'+k);
    if(k==='terms')ui.onb.touched.terms=true;
    const show=ui.onb.touched[k];
    if(k!=='terms'){t.classList.toggle('err',!!(show&&err));t.classList.toggle('okk',!!(show&&!err));t.setAttribute('aria-invalid',!!(show&&err))}
    if(h){h.textContent=show?(err||OKMSG[k]):(k==='pass'?'Mínimo 8 caracteres, una mayúscula y un número. Se guarda cifrada (hash).':'');h.className='hint '+(show?(err?'err':'okk'):'')}
    if(k==='pass'){const ps=passScore(v);$$('#strength i').forEach((i,n)=>i.style.background=n<ps?['var(--bad)','var(--warn)','var(--brand-2)','var(--ok)'][ps-1]:'var(--line)')}
  }
  if(p.startsWith('w3.gen')){const cv=$('#qrCv');if(cv){drawQR(cv,qrPayload());const a=parseFloat(ui.w3.genAmount);$('#qrAmt').textContent=a>0?fmt(a):'Monto libre';$('#qrCon').textContent=ui.w3.genConcept;$('#qrPayload').textContent=qrPayload()}}
  notify();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else $('#console').classList.remove('open')}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#fab').addEventListener('click',()=>{$('#console').classList.add('open');notify()});
$('#conClose').addEventListener('click',()=>$('#console').classList.remove('open'));
$('#themeBtn').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);setTheme(dark?'light':'dark')});
document.addEventListener('submit',e=>{const id=e.target.id;const h={loginForm:doLogin,regForm:doRegister,kycForm:runKyc,ctFormEl:addContact}[id];if(h){e.preventDefault();h()}});
/* Un campo del registro se valida al salir de él */
document.addEventListener('focusout',e=>{const p=e.target.dataset?.in;if(!p||!p.startsWith('onb.d.'))return;const k=p.split('.').at(-1);if(ui.onb.touched[k])return;ui.onb.touched[k]=true;e.target.dispatchEvent(new Event('input',{bubbles:true}))});
$('#logoutBtn').innerHTML=ic('logout');
$('#fabIc').innerHTML=ic('terminal');$('#conIc').innerHTML=ic('terminal');$('#conClose').innerHTML=ic('x');

/* refresco de tiempos relativos y SLA */
setInterval(()=>{$$('[data-region]').forEach(el=>{if(['recent','history','hitlList','idemStore'].includes(el.dataset.region))el._h=null});notify()},30000);

/* arranque */
(function boot(){
  let t=null;try{t=localStorage.getItem('aliada-theme')}catch(e){}
  setTheme(t);
  const h=location.hash.slice(1);
  go(h==='onboarding'?'onboarding':'ingresar',{instant:true});
})();
</script>
